<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget — ₦1,500,000</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f12;
  --bg2: #14171c;
  --bg3: #1c2028;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0ede8;
  --muted: #7a7f8a;
  --muted2: #4a4f5a;
  --green: #4ade80;
  --cyan: #22d3ee;
  --amber: #f59e0b;
  --red: #f87171;
  --purple: #a78bfa;
  --indigo: #6366f1;
  --teal: #2dd4bf;
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'Epilogue', system-ui, sans-serif;
  --mono: 'DM Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh;padding:2rem}

/* TOP */
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
.title{font-family:var(--serif);font-size:32px;color:var(--text)}
.title span{color:var(--green)}
.subtitle{font-size:13px;color:var(--muted);margin-top:4px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* SUMMARY CARDS */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:2rem}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.scard .slabel{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.scard .sval{font-family:var(--mono);font-size:20px;font-weight:500}
.scard .ssub{font-size:11px;color:var(--muted);margin-top:3px}

/* BUCKETS */
.bucket{margin-bottom:1rem;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.bucket-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:var(--bg2);user-select:none;transition:background .15s}
.bucket-header:hover{background:var(--bg3)}
.bh-left{display:flex;align-items:center;gap:10px}
.bh-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bh-name{font-size:14px;font-weight:500}
.bh-count{font-size:11px;color:var(--muted);margin-left:2px}
.bh-right{display:flex;align-items:center;gap:14px}
.bh-total{font-family:var(--mono);font-size:14px;font-weight:500}
.bh-pct{font-size:11px;color:var(--muted)}
.bh-arrow{color:var(--muted);font-size:13px;transition:transform .2s}
.bh-arrow.open{transform:rotate(90deg)}
.prog-bar{height:3px;background:var(--bg3)}
.prog-fill{height:100%;transition:width .4s}

/* BODY */
.bucket-body{display:none}
.bucket-body.open{display:block}
.line-header{display:grid;grid-template-columns:1fr 130px 130px 110px 36px;gap:0;background:var(--bg3);padding:6px 16px;border-top:1px solid var(--border)}
.lh-cell{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:500}
.lh-cell.r{text-align:right}
.lh-cell.c{text-align:center}

.line-row{display:grid;grid-template-columns:1fr 130px 130px 110px 36px;gap:0;border-top:1px solid var(--border);transition:background .1s}
.line-row:hover{background:rgba(255,255,255,0.02)}
.lc{padding:9px 16px;display:flex;flex-direction:column;justify-content:center}
.lc.r{align-items:flex-end;text-align:right}
.lc.c{align-items:center;text-align:center}
.lname{font-size:13px;color:var(--text)}
.lnote{font-size:11px;color:var(--muted2);margin-top:1px}
.lnote input{background:transparent;border:none;color:var(--muted2);font-size:11px;font-family:var(--sans);width:100%;outline:none}
.lnote input:focus{color:var(--muted);border-bottom:1px dashed var(--muted2)}
.lname-edit{background:transparent;border:none;color:var(--text);font-size:13px;font-family:var(--sans);width:100%;outline:none}
.lname-edit:focus{color:var(--cyan);border-bottom:1px dashed var(--muted2)}
input.amt{background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:13px;text-align:right;width:100%;outline:none}
input.amt:focus{color:var(--green)}
.editable-wrap{border-bottom:1px dashed var(--muted2);display:inline-flex;width:100%;justify-content:flex-end}

/* TAGS */
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px}
.tag-debt{background:rgba(248,113,113,.12);color:var(--red)}
.tag-fixed{background:rgba(34,211,238,.1);color:var(--cyan)}
.tag-var{background:rgba(245,158,11,.1);color:var(--amber)}
.tag-save{background:rgba(74,222,128,.1);color:var(--green)}
.tag-inv{background:rgba(167,139,250,.1);color:var(--purple)}

/* VARIANCE */
.var-pos{color:var(--red);font-family:var(--mono);font-size:12px}
.var-neg{color:var(--green);font-family:var(--mono);font-size:12px}
.var-none{color:var(--muted2);font-size:12px}

/* BUCKET FOOTER */
.bucket-footer{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--bg3);border-top:1px solid var(--border)}
.bf-stats{display:flex;gap:20px;font-size:12px;color:var(--muted)}
.bf-stats strong{color:var(--text);font-family:var(--mono)}

/* ADD / DELETE ROW BUTTONS */
.btn-add{background:transparent;border:1px dashed var(--muted2);color:var(--muted);font-size:12px;font-family:var(--sans);padding:6px 14px;border-radius:6px;cursor:pointer;width:calc(100% - 32px);margin:10px 16px;transition:all .15s}
.btn-add:hover{border-color:var(--green);color:var(--green)}
.btn-del{background:transparent;border:none;color:var(--muted2);cursor:pointer;font-size:14px;padding:0 8px;transition:color .15s;line-height:1}
.btn-del:hover{color:var(--red)}

/* GLOBAL BUTTONS */
.btn{background:transparent;border:1px solid var(--border2);color:var(--text);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-family:var(--sans);transition:all .15s}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn-primary{background:var(--green);border-color:var(--green);color:#000;font-weight:600}
.btn-primary:hover{background:#22c55e;border-color:#22c55e;color:#000}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg3);border:1px solid var(--green);color:var(--green);border-radius:8px;padding:10px 18px;font-size:13px;display:none;z-index:999}

/* OVER BUDGET BANNER */
.banner{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:10px 16px;font-size:13px;color:var(--red);margin-bottom:1.5rem;display:none}
.banner strong{font-family:var(--mono)}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="title">Zero-Based Budget <span>·</span> ₦1,500,000</div>
    <div class="subtitle">Every naira assigned · Edit inline · Save to browser</div>
  </div>
  <div class="top-actions">
    <button class="btn" onclick="resetActuals()">Reset actuals</button>
    <button class="btn" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-primary" onclick="saveData()">Save</button>
  </div>
</div>

<div class="summary" id="summaryRow"></div>
<div class="banner" id="overBudgetBanner"></div>
<div id="buckets"></div>

<div class="toast" id="toast"></div>

<script>
const INCOME = 1500000;

// ─── DATA ──────────────────────────────────────────────────────────────────
const DEFAULT_BUCKETS = [

    items:[
      {name:'Transport to & from work', note:'Ride-share / BRT — no personal vehicle yet', planned:240000, actual:'', tag:'fixed'},

    ]
  },
  {
    id:'debt', name:'Debt repayment', color:'#f43f5e',
    items:[
      {name:'Stanbic IBTC', note:'Enter outstanding balance as reference', planned:300000, actual:'', tag:'debt'},
    ],
    addable: true,

  },
  {
    id:'utilities', name:'Utilities & connectivity', color:'#38bdf8',
    items:[

      {name:'Petrol / diesel — personal errands', note:'Weekend & non-commute use', planned:40000, actual:'', tag:'fixed'},
      {name:'Vehicle maintenance buffer', note:'Oil, tyres, minor work — accumulate if unused', planned:25000, actual:'', tag:'var'},
      {name:'Vehicle insurance (monthly provision)', note:'1/12 of annual premium', planned:15000, actual:'', tag:'fixed'},
    ]
  },
  {
    id:'emergency', name:'Emergency fund', color:'#2dd4bf',
    items:[
      {name:'Emergency fund contribution', note:'Target: 6 months expenses ≈ ₦9M — Stanbic HY savings', planned:100000, actual:'', tag:'save'},
    ]
  },
  {
    id:'investments', name:'Savings & investments', color:'#a78bfa',
    items:[
      {name:'Crypto — BTC / ETH (capped exposure)', note:'Deliberate, disciplined — max 10% of invest bucket', planned:150000, actual:'', tag:'inv'},
      {name:'Equities — NGX / US stocks', note:'Bamboo, Chaka, or Stanbic brokerage', planned:300000, actual:'', tag:'inv'},
      {name:'Real estate fund — Ibeju-Lekki corridor', note:'Accumulating toward ₦5M land deposit', planned:0, actual:'', tag:'inv'},
      {name:'REIT / money market (bridge)', note:'Cowrywise / ARM — liquid bridge to land', planned:0, actual:'', tag:'inv'},
    ]
  },
  {
    id:'startup', name:'ThinkATS — startup budget', color:'#34d399',
    items:[

    ]
  },
  {
    id:'food', name:'Food & nutrition', color:'#f97316',
    items:[
      {name:'Weekly grocery run (staples & protein)', note:'Rice, beans, chicken, fish, vegetables', planned:30000, actual:'', tag:'var'},
      {name:'Blueberries, grapes & premium fruit', note:'Weekly premium fruit haul', planned:12000, actual:'', tag:'var'},
      {name:'Yoghurt & dairy', note:'Greek yoghurt, milk', planned:8000, actual:'', tag:'var'},
      {name:'Eggs (bulk — crate × 2)', note:'', planned:5000, actual:'', tag:'var'},

  },
  {
    id:'personal', name:'Personal & hygiene', color:'#e879f9',
    items:[
      {name:'Laundry — dry clean + wash & fold', note:'', planned:10000, actual:'', tag:'var'},
      {name:'Toiletries & grooming', note:'Skincare, deodorant, shaving', planned:10000, actual:'', tag:'var'},
      {name:'Haircut / barber', note:'', planned:5000, actual:'', tag:'var'},
      {name:'Clothing & footwear', note:'Intentional — not impulse', planned:20000, actual:'', tag:'var'},

    ]

  {
    id:'growth', name:'Learning & growth', color:'#86efac',

      {name:'Books — physical + Kindle', note:'2–3 titles per month', planned:8000, actual:'', tag:'var'},
      {name:'Online courses & platforms', note:'Coursera, Udemy, Selar', planned:10000, actual:'', tag:'var'},
      {name:'Software tools & subscriptions', note:'Claude Pro, Notion, design tools', planned:15000, actual:'', tag:'fixed'},
      {name:'Events, conferences & networking', note:'Monthly provision', planned:10000, actual:'', tag:'var'},
    ]
  },
  {
    id:'giving', name:'Giving & family', color:'#94a3b8',
    items:[
      {name:'Family support — parents / siblings', note:'Intentional generosity, not guilt', planned:20000, actual:'', tag:'var'},
      {name:'Gifts & celebrations', note:'Birthdays, occasions', planned:5000, actual:'', tag:'var'},
      {name:'Tithe / sadaqah / charity', note:'', planned:10000, actual:'', tag:'var'},
    ]
  },
  {
    id:'leisure', name:'Entertainment & leisure', color:'#818cf8',
    items:[
      {name:'Streaming — Netflix / Showmax / Spotify', note:'', planned:7000, actual:'', tag:'fixed'},
      {name:'Outings, concerts, experiences', note:'Lagos social — capped', planned:15000, actual:'', tag:'var'},
      {name:'Weekend trips / staycations', note:'Accumulate if unused', planned:10000, actual:'', tag:'var'},
    ]
  },
  {
    id:'buffer', name:'Flex buffer', color:'#64748b',
    items:[
      {name:'Unplanned overflow / miscellaneous', note:'Tap only if needed — not a spending fund', planned:15000, actual:'', tag:'var'},
    ]
  },
];

// ─── STATE ─────────────────────────────────────────────────────────────────
let STATE = { buckets: JSON.parse(JSON.stringify(DEFAULT_BUCKETS)) };

function loadState() {
  try {
    const s = localStorage.getItem('axisbudget_v2');
    if (s) STATE = JSON.parse(s);
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('axisbudget_v2', JSON.stringify(STATE));
  } catch(e) {}
}

// ─── HELPERS ───────────────────────────────────────────────────────────────
function fmt(n) {
  if (n === '' || n === null || n === undefined) return '—';
  return '₦' + Math.round(n).toLocaleString('en-NG');
}

function totalPlanned() {
  return STATE.buckets.reduce((s,b) => s + b.items.reduce((ss,i) => ss + (parseFloat(i.planned)||0), 0), 0);
}

function totalActual() {
  return STATE.buckets.reduce((s,b) => s + b.items.reduce((ss,i) => ss + (parseFloat(i.actual)||0), 0), 0);
}

function bucketPlanned(b) {
  return b.items.reduce((s,i) => s + (parseFloat(i.planned)||0), 0);
}

function bucketActual(b) {
  return b.items.reduce((s,i) => s + (parseFloat(i.actual)||0), 0);
}

// ─── SUMMARY ───────────────────────────────────────────────────────────────
function renderSummary() {
  const planned = totalPlanned();
  const actual = totalActual();
  const net = INCOME - planned;

  const savB = STATE.buckets.find(b => b.id === 'investments');
  const efB  = STATE.buckets.find(b => b.id === 'emergency');
  const savP = (savB ? bucketPlanned(savB) : 0) + (efB ? bucketPlanned(efB) : 0);
  const savRate = Math.round(savP / INCOME * 100);

  const banner = document.getElementById('overBudgetBanner');
  if (net < 0) {
    banner.style.display = 'block';
    banner.innerHTML = `Over budget by <strong>${fmt(Math.abs(net))}</strong> — trim investments, discretionary, or reduce a variable bucket to balance.`;
  } else {
    banner.style.display = 'none';
  }

  document.getElementById('summaryRow').innerHTML = [
    { label:'Monthly income',    val: fmt(INCOME),  sub: 'Gross', color: 'var(--green)' },
    { label:'Total budgeted',    val: fmt(planned), sub: Math.round(planned/INCOME*100)+'% of income', color: planned>INCOME?'var(--red)':'var(--amber)' },
    { label:'Surplus',           val: fmt(net),     sub: net>=0?'Unallocated — assign it':'DEFICIT!', color: net>=0?'var(--green)':'var(--red)' },
    { label:'Savings rate',      val: savRate+'%',  sub: 'Invest + EF / income', color: 'var(--purple)' },
    { label:'Actuals entered',   val: actual ? fmt(actual) : '—', sub: actual ? Math.round(actual/planned*100)+'% of budget spent' : 'Enter as month progresses', color: 'var(--cyan)' },
  ].map(c => `
    <div class="scard">
      <div class="slabel">${c.label}</div>
      <div class="sval" style="color:${c.color}">${c.val}</div>
      <div class="ssub">${c.sub}</div>
    </div>
  `).join('');
}

// ─── BUCKETS ───────────────────────────────────────────────────────────────
function renderBuckets() {
  const container = document.getElementById('buckets');
  container.innerHTML = '';

  STATE.buckets.forEach((bucket, bi) => {
    const bP = bucketPlanned(bucket);
    const bA = bucketActual(bucket);
    const pct = Math.round(bP / INCOME * 100);
    const fillW = Math.min(100, pct * 2); // 50% = full bar

    const tagLabel = { debt:'debt', fixed:'fixed', var:'variable', save:'saving', inv:'investment' };
    const tagClass = { debt:'tag-debt', fixed:'tag-fixed', var:'tag-var', save:'tag-save', inv:'tag-inv' };

    // Line rows
    let rows = '';
    bucket.items.forEach((item, ii) => {
      const act = parseFloat(item.actual) || '';
      const variance = act !== '' ? act - (parseFloat(item.planned)||0) : '';
      rows += `
        <div class="line-row" id="row-${bi}-${ii}">
          <div class="lc">
            <input class="lname-edit" type="text" value="${escHtml(item.name)}"
              onchange="updateField(${bi},${ii},'name',this.value)"
              placeholder="Item name">
            <div class="lnote">
              <input type="text" value="${escHtml(item.note||'')}"
                onchange="updateField(${bi},${ii},'note',this.value)"
                placeholder="Add note…">
            </div>
          </div>
          <div class="lc r">
            <div class="editable-wrap">
              <input class="amt" type="number" value="${item.planned}"
                onchange="updateField(${bi},${ii},'planned',this.value)">
            </div>
          </div>
          <div class="lc r">
            <div class="editable-wrap">
              <input class="amt" type="number" value="${act}" placeholder="0"
                onchange="updateField(${bi},${ii},'actual',this.value)">
            </div>
          </div>
          <div class="lc c" style="gap:4px">
            ${variance !== '' ? `<span class="${variance>0?'var-pos':'var-neg'}">${variance>0?'+':''}${fmt(variance)}</span>` : '<span class="var-none">—</span>'}
            <span class="tag ${tagClass[item.tag]||'tag-var'}">${tagLabel[item.tag]||item.tag}</span>
          </div>
          <div class="lc c">
            <button class="btn-del" onclick="deleteLine(${bi},${ii})" title="Remove row">✕</button>
          </div>
        </div>
      `;
    });

    const addLabel = bucket.addLabel || '+ Add line item';

    const div = document.createElement('div');
    div.className = 'bucket';
    div.innerHTML = `
      <div class="bucket-header" onclick="toggleBucket(${bi})">
        <div class="bh-left">
          <div class="bh-dot" style="background:${bucket.color}"></div>
          <div class="bh-name">${escHtml(bucket.name)}</div>
          <div class="bh-count">${bucket.items.length} line${bucket.items.length!==1?'s':''}</div>
        </div>
        <div class="bh-right">
          <div class="bh-total" style="color:${bucket.color}">${fmt(bP)}</div>
          <div class="bh-pct">${pct}% of income</div>
          <div class="bh-arrow${bucket._open?' open':''}" id="arrow-${bi}">›</div>
        </div>
      </div>
      <div class="prog-bar">
        <div class="prog-fill" style="width:${fillW}%;background:${bucket.color}66"></div>
      </div>
      <div class="bucket-body${bucket._open?' open':''}" id="body-${bi}">
        <div class="line-header">
          <div class="lh-cell">Item · click name or note to edit</div>
          <div class="lh-cell r">Planned (₦)</div>
          <div class="lh-cell r">Actual (₦)</div>
          <div class="lh-cell c">Variance / type</div>
          <div class="lh-cell"></div>
        </div>
        ${rows}
        <button class="btn-add" onclick="addLine(${bi})">${escHtml(addLabel)}</button>
        <div class="bucket-footer">
          <div class="bf-stats">
            <span>Budgeted: <strong>${fmt(bP)}</strong></span>
            ${bA ? `<span>Actual: <strong>${fmt(bA)}</strong></span><span>Variance: <strong style="color:${bA>bP?'var(--red)':'var(--green)'}">${fmt(bA-bP)}</strong></span>` : '<span style="color:var(--muted2)">No actuals entered</span>'}
          </div>
        </div>
      </div>
    `;
    container.appendChild(div);
  });

  renderSummary();
}

// ─── INTERACTIONS ──────────────────────────────────────────────────────────
function toggleBucket(bi) {
  STATE.buckets[bi]._open = !STATE.buckets[bi]._open;
  const body  = document.getElementById('body-'  + bi);
  const arrow = document.getElementById('arrow-' + bi);
  body.classList.toggle('open', STATE.buckets[bi]._open);
  arrow.classList.toggle('open', STATE.buckets[bi]._open);
}

function updateField(bi, ii, field, val) {
  if (field === 'planned' || field === 'actual') {
    STATE.buckets[bi].items[ii][field] = parseFloat(val) || 0;
  } else {
    STATE.buckets[bi].items[ii][field] = val;
  }
  renderSummary();
  // Refresh just the footer of this bucket without full re-render
  // (full re-render on add/delete, partial on edit)
}

function addLine(bi) {
  const bucket = STATE.buckets[bi];
  const defaultTag = bucket.id === 'debt' ? 'debt' : 'var';
  bucket.items.push({ name: 'New item', note: '', planned: 0, actual: '', tag: defaultTag });
  bucket._open = true;
  renderBuckets();
}

function deleteLine(bi, ii) {
  if (STATE.buckets[bi].items.length <= 1) {
    showToast('Need at least one line per bucket');
    return;
  }
  STATE.buckets[bi].items.splice(ii, 1);
  renderBuckets();
}

function resetActuals() {
  if (!confirm('Clear all actual amounts? Planned figures are kept.')) return;
  STATE.buckets.forEach(b => b.items.forEach(i => i.actual = ''));
  renderBuckets();
  showToast('Actuals cleared');
}

function saveData() {
  saveState();
  showToast('Saved to browser storage ✓');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 2800);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── EXPORT CSV ────────────────────────────────────────────────────────────
function exportCSV() {
  const rows = [['Bucket','Item','Note','Tag','Planned (₦)','Actual (₦)','Variance (₦)']];
  STATE.buckets.forEach(b => {
    b.items.forEach(i => {
      const act = parseFloat(i.actual)||0;
      const plan = parseFloat(i.planned)||0;
      rows.push([b.name, i.name, i.note||'', i.tag, plan, act||'', act ? act-plan : '']);
    });
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'axis-budget.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ─── INIT ──────────────────────────────────────────────────────────────────
loadState();
// Open first three buckets by default if fresh load
if (!STATE.buckets[0]._open) {
  STATE.buckets.slice(0, 3).forEach(b => b._open = true);
}
renderBuckets();
</script>
